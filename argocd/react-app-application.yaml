apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: react-app-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/kitya123/devops-gitops-manifests.git
    targetRevision: HEAD
    path: gitops-manifests/react-app
  destination:
    server: https://kubernetes.default.svc
    namespace: react-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
